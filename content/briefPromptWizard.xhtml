<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet href="chrome://global/skin/" type="text/css"?>
<?xml-stylesheet href="chrome://zotero/skin/zotero.css" type="text/css"?>
<?xml-stylesheet href="chrome://zotseek/content/briefPromptWizard.css" type="text/css"?>
<!DOCTYPE window>
<window xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
  xmlns:html="http://www.w3.org/1999/xhtml"
  id="zotseek-brief-prompt-wizard"
  width="640" height="640" persist="width,height,screenX,screenY">
  <linkset><html:link rel="localization" href="zotseek.ftl"/></linkset>
  <script src="chrome://zotero/content/include.js"/>
  <script src="chrome://zotero/content/customElements.js"/>
  <script type="application/javascript" src="chrome://zotseek/content/scripts/brief-prompt-wizard.js"/>

  <vbox flex="1" style="min-width:560px;min-height:0;">
    <html:div class="zs-wizard-banner">
      <html:h1 class="zs-wizard-banner-title" data-l10n-id="zotseek-brief-prompt-wizard-title"></html:h1>
      <html:div class="zs-wizard-steps" id="zotseek-brief-wizard-steps">
        <html:span class="zs-wizard-step" data-step="intro"><html:span class="zs-step-dot">1</html:span><html:span data-l10n-id="zotseek-brief-wizard-step-intro"></html:span></html:span>
        <html:span class="zs-wizard-step-bar"></html:span>
        <html:span class="zs-wizard-step" data-step="service"><html:span class="zs-step-dot">2</html:span><html:span data-l10n-id="zotseek-brief-wizard-step-service"></html:span></html:span>
        <html:span class="zs-wizard-step-bar"></html:span>
        <html:span class="zs-wizard-step" data-step="template"><html:span class="zs-step-dot">3</html:span><html:span data-l10n-id="zotseek-brief-wizard-step-template"></html:span></html:span>
        <html:span class="zs-wizard-step-bar"></html:span>
        <html:span class="zs-wizard-step" data-step="questions"><html:span class="zs-step-dot">4</html:span><html:span data-l10n-id="zotseek-brief-wizard-step-questions"></html:span></html:span>
        <html:span class="zs-wizard-step-bar"></html:span>
        <html:span class="zs-wizard-step" data-step="confirm"><html:span class="zs-step-dot">5</html:span><html:span data-l10n-id="zotseek-brief-wizard-step-confirm"></html:span></html:span>
      </html:div>
    </html:div>

    <html:div class="zs-wizard-pages">
      <!-- Intro page: explains the brief feature before any setup -->
      <html:div id="zotseek-brief-wizard-intro-page" class="zs-wizard-card">
        <html:h2 data-l10n-id="zotseek-brief-wizard-intro-title"/>
        <html:p class="zs-wizard-intro-lead" data-l10n-id="zotseek-brief-wizard-intro-lead"></html:p>
        <html:div class="zs-wizard-feature">
          <html:div class="zs-wizard-feature-icon">📖</html:div>
          <html:div>
            <html:strong data-l10n-id="zotseek-brief-wizard-intro-readable-title"/>
            <html:span data-l10n-id="zotseek-brief-wizard-intro-readable-desc"></html:span>
          </html:div>
        </html:div>
        <html:div class="zs-wizard-feature">
          <html:div class="zs-wizard-feature-icon">🔍</html:div>
          <html:div>
            <html:strong data-l10n-id="zotseek-brief-wizard-intro-search-title"/>
            <html:span data-l10n-id="zotseek-brief-wizard-intro-search-desc"></html:span>
          </html:div>
        </html:div>
        <html:div class="zs-wizard-feature">
          <html:div class="zs-wizard-feature-icon">🛡️</html:div>
          <html:div>
            <html:strong data-l10n-id="zotseek-brief-wizard-intro-privacy-title"/>
            <html:span data-l10n-id="zotseek-brief-wizard-intro-privacy-desc"></html:span>
          </html:div>
        </html:div>
      </html:div>

      <html:div id="zotseek-brief-wizard-service-page" class="zs-wizard-card" hidden="hidden">
        <html:h2 data-l10n-id="zotseek-brief-wizard-service-title"/>
        <html:p class="zs-wizard-desc" data-l10n-id="zotseek-brief-wizard-service-desc"></html:p>
        <html:div class="zs-wizard-grid">
          <html:span data-l10n-id="zotseek-pref-brief-provider"></html:span>
          <html:strong id="zotseek-brief-wizard-provider">—</html:strong>
          <html:label for="zotseek-brief-wizard-model" data-l10n-id="zotseek-pref-brief-model"></html:label>
          <html:div style="display:flex;gap:8px;">
            <html:input id="zotseek-brief-wizard-model" type="text" autocomplete="off" style="flex:1;"/>
            <button id="zotseek-brief-wizard-refresh-models" data-zotseek-label="zotseek-pref-brief-refresh-models"/>
          </html:div>
        </html:div>
        <checkbox id="zotseek-brief-wizard-consent" native="true" data-l10n-id="zotseek-brief-wizard-consent" style="margin-top:16px;"/>
        <html:p class="zs-wizard-fineprint" data-l10n-id="zotseek-brief-wizard-consent-desc"></html:p>
        <hbox align="center">
          <button id="zotseek-brief-wizard-test" data-zotseek-label="zotseek-pref-brief-test"/>
          <label id="zotseek-brief-wizard-service-status" style="margin-left:8px;color:#77809a;"/>
        </hbox>
      </html:div>

      <html:div id="zotseek-brief-wizard-template-page" class="zs-wizard-card" hidden="hidden">
        <html:h2 data-l10n-id="zotseek-brief-wizard-template-title"/>
        <html:p class="zs-wizard-desc" data-l10n-id="zotseek-brief-wizard-template-desc"></html:p>
        <html:label class="zs-wizard-choice zs-selected" id="zotseek-brief-wizard-choice-personalized">
          <html:input id="zotseek-brief-wizard-template-personalized" type="radio" name="brief-template" value="personalized" checked="checked"/>
          <html:strong data-l10n-id="zotseek-brief-wizard-template-personalized-title"/>
          <html:p data-l10n-id="zotseek-brief-wizard-template-personalized-desc"></html:p>
        </html:label>
        <html:label class="zs-wizard-choice" id="zotseek-brief-wizard-choice-bundled">
          <html:input id="zotseek-brief-wizard-template-bundled" type="radio" name="brief-template" value="bundled"/>
          <html:strong data-l10n-id="zotseek-brief-wizard-template-bundled-title"/>
          <html:p data-l10n-id="zotseek-brief-wizard-template-bundled-desc"></html:p>
        </html:label>
      </html:div>

      <html:div id="zotseek-brief-wizard-questions-page" class="zs-wizard-card" hidden="hidden">
        <html:h2 data-l10n-id="zotseek-brief-wizard-questions-title"/>
        <html:p class="zs-wizard-desc" data-l10n-id="zotseek-brief-wizard-questions-desc"></html:p>
        <html:label for="zotseek-brief-wizard-domain" data-l10n-id="zotseek-brief-prompt-wizard-domain-label"/>
        <html:input id="zotseek-brief-wizard-domain" type="text" maxlength="200" required="required" style="margin:4px 0 3px;"/>
        <html:p class="zs-wizard-fineprint" data-l10n-id="zotseek-brief-wizard-domain-example" style="margin-left:0;"></html:p>
        <html:label for="zotseek-brief-wizard-language" data-l10n-id="zotseek-brief-prompt-wizard-language-label"/>
        <html:input id="zotseek-brief-wizard-language" type="text" maxlength="100" required="required" style="margin:4px 0 10px;"/>
        <html:label for="zotseek-brief-wizard-habits" data-l10n-id="zotseek-brief-prompt-wizard-habits-label"/>
        <html:textarea id="zotseek-brief-wizard-habits" rows="5" maxlength="1000" style="margin-top:4px;resize:vertical;"/>
        <html:p class="zs-wizard-fineprint" data-l10n-id="zotseek-brief-wizard-focus-example" style="margin-left:0;margin-top:3px;"></html:p>
      </html:div>

      <html:div id="zotseek-brief-wizard-confirm-page" class="zs-wizard-card" hidden="hidden">
        <html:h2 data-l10n-id="zotseek-brief-wizard-confirm-title"/>
        <html:p class="zs-wizard-desc" data-l10n-id="zotseek-brief-wizard-confirm-desc"></html:p>
        <html:pre id="zotseek-brief-wizard-summary" class="zs-wizard-summary"></html:pre>
        <html:p class="zs-wizard-fineprint" data-l10n-id="zotseek-brief-wizard-confirm-disclosure" style="margin-left:0;margin-top:10px;"></html:p>
      </html:div>

      <html:div id="zotseek-brief-wizard-result-page" class="zs-wizard-card" hidden="hidden">
        <html:div class="zs-wizard-result-hero">
          <html:div class="zs-wizard-result-check">✓</html:div>
          <html:h2 data-l10n-id="zotseek-brief-wizard-result-title"/>
        </html:div>
        <description id="zotseek-brief-wizard-result-message"/>
        <vbox id="zotseek-brief-wizard-result-path-box" hidden="true" style="margin-top:12px;">
          <label data-l10n-id="zotseek-brief-prompt-wizard-location-label"/>
          <hbox align="center" style="margin-top:4px;">
            <textbox id="zotseek-brief-wizard-path" readonly="true" flex="1" crop="end"/>
            <button id="zotseek-brief-wizard-open-location" data-zotseek-label="zotseek-brief-prompt-wizard-open-location"/>
          </hbox>
        </vbox>
      </html:div>
    </html:div>

    <label id="zotseek-brief-wizard-status" class="zs-wizard-status"/>
    <hbox pack="end" class="zs-wizard-footer" style="margin:8px 26px 16px;">
      <button id="zotseek-brief-wizard-cancel" data-zotseek-label="zotseek-brief-prompt-wizard-cancel"/>
      <button id="zotseek-brief-wizard-back" data-zotseek-label="zotseek-brief-wizard-back" style="margin-left:6px;"/>
      <button id="zotseek-brief-wizard-next" data-zotseek-label="zotseek-brief-wizard-next" default="true" style="margin-left:6px;"/>
    </hbox>
  </vbox>
</window>
